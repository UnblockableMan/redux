<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="280" height="100">
  <!-- redux logo — Roman numeral X (10) + 'redux' wordmark, opium-clear inspired -->
  <defs>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9a8cf5"/>
    </linearGradient>
  </defs>
  <!-- Roman X (10) — large italic serif on the left -->
  <text x="55" y="76" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="82" font-weight="400" fill="url(#rg)" text-anchor="middle" letter-spacing="-2">X</text>
  <!-- 'redux' wordmark on the right -->
  <text x="115" y="68" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="42" font-weight="400" fill="#ffffff" letter-spacing="-0.5">redux</text>
  <!-- Small accent dot after 'redux' -->
  <circle cx="262" cy="60" r="4" fill="#9a8cf5"/>
</svg>
