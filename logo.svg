<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100">
  <!-- redux — opium-inspired wordmark logo -->
  <!-- Stylized roman numeral III (v3) on the left + 'redux.' wordmark on the right -->
  <defs>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9a8cf5"/>
    </linearGradient>
  </defs>
  <!-- The III numeral — italic serif -->
  <text x="20" y="76" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="78" font-weight="400" fill="url(#rg)" letter-spacing="3">III</text>
  <!-- The redux wordmark -->
  <text x="115" y="68" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="42" font-weight="400" fill="#ffffff" letter-spacing="-0.5">redux</text>
  <circle cx="220" cy="60" r="4" fill="#9a8cf5"/>
</svg>
